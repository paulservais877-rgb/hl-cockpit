<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>Alpha OS · Démo</title>
  <link rel="stylesheet" href="assets/css/app.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" media="print" onload="this.media='all'" />
  <script>window.AOS_DEMO = true;</script>
</head>
<body data-state="safe">
<div class="wrap" id="app-root"><p class="empty" style="padding:24px">Chargement de la démo…</p></div>
<script>
  // Load the main page markup (same origin) so demo.html stays a thin wrapper.
  (async () => {
    try {
      const txt = await (await fetch("index.html", { cache: "no-store" })).text();
      const doc = new DOMParser().parseFromString(txt, "text/html");
      const wrap = doc.querySelector(".wrap");
      const scene = doc.querySelector(".maree");
      if (scene) document.body.insertBefore(scene, document.body.firstChild);
      document.getElementById("app-root").replaceWith(wrap);
      for (const s of doc.querySelectorAll("script[src]")) { await new Promise((res, rej) => { const el = document.createElement("script"); el.src = s.getAttribute("src"); el.onload = res; el.onerror = rej; document.body.appendChild(el); }); }
    } catch (e) { document.body.innerHTML = '<p style="padding:24px;font-family:sans-serif;color:#e7eaf1">Impossible de charger index.html : ' + (e && e.message) + '. Ouvre <a href="index.html?demo=1" style="color:#8fb3ff">index.html?demo=1</a>.</p>'; }
  })();
</script>
</body>
</html>
