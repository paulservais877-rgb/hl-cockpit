name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/run.js
      # Live API diagnostic against the default wallet (public on-chain data). Never fails the build.
      - name: Hyperliquid API diagnostic
        continue-on-error: true
        run: node tests/diagnostic.js 0x35f0851EF6516c5706107b86dBe09A62A311ab07 --pipeline
