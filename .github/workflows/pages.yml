# GitHub Pages for this repository is configured to deploy from the `main` branch (Settings → Pages → Source: branch).
# Nothing to do here on push: merging into `main` publishes the dashboard automatically.
# This workflow only exists for the alternative setup (Settings → Pages → Source: "GitHub Actions") and runs on demand.
name: Deploy to GitHub Pages (manual, Actions source only)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
